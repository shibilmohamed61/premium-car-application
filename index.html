<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE MOTORS — Driven by Excellence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0B0B0B;
            --bg-secondary: #151515;
            --bg-card: #181818;
            --bg-card-hover: #202020;
            --accent: #C6A56B;
            --accent-hover: #D8B77D;
            --text-primary: #FFFFFF;
            --text-secondary: #A3A3A3;
            --border-color: #262626;
            --border-hover: #3E3E3E;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: var(--transition);
        }

        ul {
            list-style: none;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
        }

        /* Typography Helpers */
        .serif {
            font-family: var(--font-serif);
        }

        .text-accent {
            color: var(--accent);
        }

        .text-muted {
            color: var(--text-secondary);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: var(--transition);
            cursor: pointer;
            border-radius: 2px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--bg-primary);
            border: 1px solid var(--accent);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-hover);
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        /* Header & Navigation */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(11, 11, 11, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 40px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-mark {
            width: 42px;
            height: 42px;
            background-color: var(--accent);
            color: var(--bg-primary);
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.05em;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.15em;
        }

        .brand-tagline {
            font-size: 0.65rem;
            color: var(--text-secondary);
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .main-nav .nav-list {
            display: flex;
            gap: 36px;
        }

        .nav-link {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            position: relative;
            padding: 6px 0;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-primary);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--accent);
            transition: var(--transition);
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon-btn {
            position: relative;
            color: var(--text-primary);
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .icon-btn:hover {
            color: var(--accent);
        }

        .badge {
            position: absolute;
            top: 0;
            right: 0;
            background-color: var(--accent);
            color: var(--bg-primary);
            font-size: 0.65rem;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .hamburger span {
            display: block;
            width: 28px;
            height: 2px;
            background-color: var(--text-primary);
            transition: var(--transition);
        }

        #app-container {
            padding-top: 90px;
            min-height: calc(100vh - 90px);
        }

        /* Hero Section */
        .hero {
            position: relative;
            height: calc(100vh - 90px);
            min-height: 650px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.5);
            transform: scale(1.05);
            animation: slowZoom 20s infinite alternate;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(11,11,11,0.3) 0%, rgba(11,11,11,0.8) 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            max-width: 900px;
            padding: 0 20px;
        }

        .hero-subtitle {
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 20px;
            display: block;
        }

        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(2.8rem, 5vw, 5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
        }

        .hero-desc {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 40px auto;
            font-weight: 300;
        }

        .hero-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        /* Section Common */
        .section {
            padding: 100px 40px;
            max-width: 1440px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .section-title p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        /* Car Grid & Cards */
        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 32px;
        }

        .car-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            overflow: hidden;
            transition: var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .car-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .car-card-img-wrapper {
            position: relative;
            height: 260px;
            overflow: hidden;
        }

        .car-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .car-card:hover .car-card-img {
            transform: scale(1.08);
        }

        .car-tag {
            position: absolute;
            top: 16px;
            left: 16px;
            background-color: var(--bg-primary);
            color: var(--accent);
            padding: 6px 12px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: 1px solid var(--accent);
        }

        .car-card-actions-top {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
        }

        .action-chip {
            width: 36px;
            height: 36px;
            background-color: rgba(11,11,11,0.7);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .action-chip:hover, .action-chip.active {
            background-color: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .car-card-body {
            padding: 28px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .car-title {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .car-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .car-specs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 16px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .car-spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .spec-value {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .car-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .car-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            font-family: var(--font-serif);
        }

        /* Brand Highlights */
        .brands-showcase {
            background-color: var(--bg-secondary);
            padding: 80px 40px;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .brands-grid {
            max-width: 1440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 24px;
        }

        .brand-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 32px 20px;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
        }

        .brand-box:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
        }

        .brand-box h3 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .brand-box p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Inventory View */
        .inventory-layout {
            max-width: 1440px;
            margin: 0 auto;
            padding: 60px 40px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 40px;
        }

        .filter-sidebar {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 32px;
            height: fit-content;
            position: sticky;
            top: 110px;
        }

        .filter-group {
            margin-bottom: 28px;
        }

        .filter-group:last-child {
            margin-bottom: 0;
        }

        .filter-group h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 14px;
            color: var(--text-primary);
        }

        .filter-group select, .filter-group input {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px;
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        .filter-group select:focus, .filter-group input:focus {
            border-color: var(--accent);
        }

        .inventory-main {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .inventory-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-secondary);
            padding: 20px 28px;
            border: 1px solid var(--border-color);
        }

        .results-count {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .sort-select {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            font-size: 0.9rem;
            outline: none;
        }

        /* Detail View */
        .car-detail-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .detail-header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-link {
